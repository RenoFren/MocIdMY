<style>
:root{--bg:#090e24;--card:#121a3f;--red:#d4182f;--red2:#6f0a1b;--blue:#1c4fd8;--blue2:#0a2168;--ink:#f4f6ff;--mute:#a9b3d6;--line:var(--w2);--w1:#ffffff0d;--w2:#ffffff1a;--w3:#ffffff33;--hb:rgba(9,14,36,.85);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,sans-serif;font-weight:800;line-height:1.05;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--red2),var(--bg) 35%,var(--bg) 65%,var(--blue2))}
.in{max-width:1080px;margin:auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px}
.brand img{height:56px;width:auto;border-radius:8px}
.sl{font:800 44px Oswald;color:var(--mute);transform:skewX(-14deg)}
nav{display:flex;gap:4px;overflow-x:auto;justify-content:center}
nav a{flex:none;padding:10px 14px;color:var(--mute);font-weight:700;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-image:linear-gradient(90deg,var(--red),var(--blue)) 1}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{padding:40px 0 24px;text-align:center}
.top h1{font-size:clamp(40px,9vw,72px)}.top p{color:var(--mute);max-width:52ch;margin:10px auto 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lg{display:flex;gap:18px;align-items:center;padding:28px 20px}
.lg img{width:110px;height:110px;object-fit:contain;flex:none;border-radius:10px}
.lg.ID{background:linear-gradient(160deg,var(--red),var(--red2))}.lg.MY{background:linear-gradient(200deg,var(--blue),var(--blue2))}
.lg h2{font-size:34px}.lg p{font-size:14px;margin:6px 0;opacity:.9}.lg small{display:block;opacity:.8;margin-bottom:12px}
.ghost{display:inline-block;border:2px solid #fff;padding:6px 16px;font-weight:700;font-size:14px}
.ghost:hover{background:#fff;color:#090e24}
section{padding:30px 0 6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{font-size:32px}.sh a,.mute{color:var(--mute);font-size:14px}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border-left:6px solid var(--c);padding:14px 16px;margin-bottom:10px}
.mid{text-align:center;display:grid;font-size:13px;color:var(--mute)}.mid b{font:800 26px Oswald;color:#fff}.mid em{font-style:normal;color:#fff;font-weight:700}
.tm{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.tm.r{flex-direction:row-reverse;text-align:right}
.hx{flex:none;width:var(--s);height:var(--s);display:grid;place-items:center;font:800 calc(var(--s)*.4) Oswald;color:#10152f;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tl{flex:none;width:var(--s);height:var(--s);object-fit:contain;border-radius:50%;padding:calc(var(--s)*.08);border:2px solid var(--w3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two h3{font-size:24px;padding-bottom:6px;border-bottom:3px solid var(--c);margin-bottom:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.tw{overflow-x:auto}
.pg{padding:28px 0}.pg>h1{font-size:52px}.pg>p{color:var(--mute);margin:4px 0 20px}
.lh{font-size:30px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tc{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px}
.tc b{display:block}.tc span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.tab{background:var(--card);border:0;color:var(--mute);padding:8px 16px;font:700 14px Poppins;cursor:pointer}
.tab.on{background:#fff;color:#090e24}
.wk{font-size:28px;margin:22px 0 10px}
.card{background:var(--card);padding:20px;border-top:4px solid var(--c)}.card h3{font-size:26px;margin-bottom:6px}
footer{margin-top:44px;padding:26px 0 30px;background:linear-gradient(90deg,var(--red2),var(--bg) 40%,var(--bg) 60%,var(--blue2));color:var(--mute);font-size:14px}
footer .brand{justify-content:flex-start;padding:0 0 12px}footer .brand img{height:64px}
@media(max-width:760px){.split,.two{grid-template-columns:1fr}.lg img{width:84px;height:84px}.mr{padding:12px}.tm span{font-size:14px}.brand img{height:46px}nav{justify-content:flex-start}}
.vt-t{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.vt-n{background:var(--card);border-left:4px solid var(--red);padding:10px 14px;font-size:13px;color:var(--mute);margin:8px 0 14px}
.vp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.vp .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue))}
.vp b{display:block}.vp span.s{color:var(--mute);font-size:13px}.vb{border:2px solid #fff;background:none;color:#fff;padding:6px 14px;font:700 13px Poppins;cursor:pointer;min-width:92px}
.vb.on{background:#fff;color:#090e24}.vc{font:800 20px Oswald;margin-right:10px}.vr{display:flex;align-items:center}
.vw{display:flex;gap:6px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

init(){CM.local();CM.draw();

async post(){const text=(CM.draft||"").trim();if(!text)return;
 if(Date.now()-CM.last<10000){CM.note="Tunggu beberapa detik sebelum komentar lagi.";CM.draw();return}
 if(CM.cfg){if(!CM.user){CM.note="Masuk dengan Google dulu untuk berkomentar.";CM.draw();return}
  try{await CM.fs.collection("comments").add({uid:CM.user.uid,name:(CM.user.displayName||"Netizen").slice(0,40),text:text.slice(0,500),rumor:!!CM.rumor,ts:firebase.firestore.FieldValue.serverTimestamp()});CM.note="";CM.draft="";CM.last=Date.now()}catch(e){CM.note="Komentar gagal dikirim. Coba lagi."}}
 else{CM.items.unshift({id:String(Date.now()),uid:"me",name:(CM.nm||"Netizen").trim().slice(0,40)||"Netizen",text:text.slice(0,500),rumor:!!CM.rumor,ts:Date.now()});
  try{localStorage.setItem("moc_cm",JSON.stringify(CM.items.slice(0,100)))}catch(e){}CM.draft="";CM.last=Date.now()}
 CM.draw()},

const ACW=()=>{const h=HOF.find(x=>x.ac);if(!h)return"";return '<h2 class="lh" style="--c:#14b8a6">🏆 '+_("Juara MOC ASEAN Cup","MOC ASEAN Cup Champions","Juara MOC ASEAN Cup")+'</h2><div style="--c:#14b8a6">'+[...h.r].reverse().map(x=>'<a class="pz" href="#team/'+x[1]+'"><span class="pl">'+TB(x[1])+'</span><div><b>'+esc(NM(x[1]))+'</b><span class="res">'+_("Juara","Champion","Juara")+' · '+h.t+'</span></div><em class="tg">'+x[0]+'</em></a>').join("")+'</div>'};

/* ===== PROFIL TIM & PEMAIN ===== */
const nf=(h,t)=>'<div class="pg in"><h1>'+_("Tidak ditemukan","Not found","Tidak dijumpai")+'</h1><p><a class="back" href="#'+h+'">← '+t+'</a></p></div>';
const pLink=p=>'#player/'+encodeURIComponent(p[2])+'/'+encodeURIComponent(p[0]);
const sec2=(c,t,b)=>b?'<h2 class="lh" style="--c:'+c+'">'+t+'</h2>'+b:"";
pages.team=()=>{const k=RT[0];if(!k||!T[k])return nf("teams","Teams");
 const t=T[k],ap=AP().filter(p=>p[2]==k),hof=[],fm=[];
 HOF.forEach(h=>h.r.forEach(x=>{if(x[1]==k)hof.push([h.t,x[0]])}));
 FMVP.forEach(f=>f.r.forEach(x=>{if(x[1]==k)fm.push([f.t,x[0],x[2]])}));
 const ms=sorted().filter(m=>m[4]==k||m[5]==k),up=ms.filter(m=>m[6]!="done"),dn=ms.filter(m=>m[6]=="done").reverse().slice(0,5);
 const tr=[...TRANSFERS].filter(x=>x[3]==k||x[4]==k).sort((a,b)=>b[0].localeCompare(a[0])),pr=PR.filter(p=>p[2]==k);
 const reg=t.l=="AC"?_("Tim nasional","National team","Pasukan negara"):t.city,c=t.c||"#56608a";
 const rows=ap.map(p=>'<a class="pz" href="'+pLink(p)+'"><span class="pl">'+hx(k,40)+'</span><div><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div></a>').join("");
 const hrows=hof.map(x=>'<div class="pz"><span class="pl">🏆</span><div><b>'+esc(x[0])+'</b><span class="res">'+_("Juara","Champion","Juara")+'</span></div><em class="tg">'+x[1]+'</em></div>').join("");
 const frows=fm.map(x=>'<div class="pz"><span class="pl">⭐</span><div><b>'+esc(x[2])+'</b><span class="res">FMVP '+esc(x[0])+'</span></div><em class="tg">'+x[1]+'</em></div>').join("");
 const trows=tr.map(x=>'<div class="pz"><span class="pl">'+TB(x[3])+'</span><div><b>'+esc(x[1])+'</b><span class="res">'+esc(NM(x[3]))+' → '+esc(NM(x[4]))+' · '+fd(x[0])+'</span></div><span class="pl">'+TB(x[4])+'</span></div>').join("");
 const prows=pr.map(p=>'<div class="pz"><span class="pl">🎖️</span><div><b>'+esc(p[1])+'</b><span class="res">'+esc(p[3])+(p[4]?' · '+esc(p[4]):'')+'</span></div>'+(p[5]?'<em class="tg">'+esc(p[5])+'</em>':'')+'</div>').join("");
 return '<div class="pg in" style="--c:'+c+'"><a class="back" href="#teams">← '+_("Semua tim","All teams","Semua pasukan")+'</a><div class="prof">'+hx(k,92)+'<div><h1>'+esc(t.n)+'</h1><div class="chips" style="margin-top:8px"><span class="chip">'+esc(t.a)+'</span><span class="chip">'+esc(reg)+'</span><span class="chip">'+ap.length+' '+_("pemain","players","pemain")+'</span>'+(hof.length?'<span class="chip">🏆 '+hof.length+'</span>':'')+(fm.length?'<span class="chip">⭐ '+fm.length+' FMVP</span>':'')+'</div></div></div>'
  +sec2(c,_("Roster pemain","Player roster","Senarai pemain"),rows||'<div class="empty">'+_("Belum ada data pemain.","No player data yet.","Belum ada data pemain.")+'</div>')
  +sec2(c,_("Gelar juara","Championship titles","Gelaran juara"),hrows)
  +sec2(c,_("Penghargaan FMVP","FMVP awards","Anugerah FMVP"),frows)
  +sec2(c,_("Prestasi","Achievements","Pencapaian"),prows)
  +sec2(c,_("Pertandingan berikutnya","Upcoming matches","Perlawanan akan datang"),up.map(match).join(""))
  +sec2(c,_("Hasil terbaru","Latest results","Keputusan terkini"),dn.map(match).join(""))
  +sec2(c,_("Transfer","Transfers","Perpindahan"),trows)+'</div>'};
pages.player=()=>{const k=RT[0],nm=RT[1]||"",low=nm.toLowerCase();
 const p=T[k]&&AP().find(q=>q[2]==k&&String(q[0]).toLowerCase()==low);if(!p)return nf("players","Players");
 const t=T[k],c=t.c||"#56608a",aw=[];
 FMVP.forEach(f=>f.r.forEach(x=>{if(String(x[2]).toLowerCase()==low)aw.push([f.t,x[0],x[1]])}));
 const tr=[...TRANSFERS].filter(x=>String(x[1]).toLowerCase()==low).sort((a,b)=>b[0].localeCompare(a[0])),mates=AP().filter(q=>q[2]==k&&q[0]!=p[0]);
 const arows=aw.map(x=>'<div class="pz"><span class="pl">⭐</span><div><b>FMVP '+esc(x[0])+'</b><span class="res">'+esc(NM(x[2]))+'</span></div><em class="tg">'+x[1]+'</em></div>').join("");
 const trows=tr.map(x=>'<div class="pz"><span class="pl">'+TB(x[3])+'</span><div><b>'+esc(NM(x[3]))+' → '+esc(NM(x[4]))+'</b><span class="res">'+fd(x[0])+' · '+(x[5]=="resmi"?_("Resmi","Official","Rasmi"):_("Rumor","Rumor","Khabar angin"))+'</span></div><span class="pl">'+TB(x[4])+'</span></div>').join("");
 const mrows=mates.map(q=>'<a class="pr" href="'+pLink(q)+'"><b>'+esc(q[0])+'</b><em>'+esc(q[1])+'</em></a>').join("");
 return '<div class="pg in" style="--c:'+c+'"><a class="back" href="#team/'+encodeURIComponent(k)+'">← '+esc(t.n)+'</a><div class="prof">'+hx(k,92)+'<div><h1>'+esc(p[0])+'</h1><div class="chips" style="margin-top:8px"><span class="chip">'+esc(p[1])+'</span><a class="chip" href="#team/'+encodeURIComponent(k)+'">'+esc(t.n)+'</a>'+(aw.length?'<span class="chip">⭐ '+aw.length+' FMVP</span>':'')+'</div></div></div>'
  +sec2(c,_("Penghargaan FMVP","FMVP awards","Anugerah FMVP"),arows)

  el.innerHTML='<div class="vt-n">'+top+(REG.note?'<br><b>'+esc(REG.note)+'</b>':'')+'</div>'+(REG.mine.length?'<div class="vt-n"><b>'+_("Pendaftaran saya","My registrations","Pendaftaran saya")+'</b>'+REG.mine.map(r=>'<div class="rmr"><span>'+esc(r.team)+' · '+esc(tn(r.t))+' <em class="tg">'+(S[r.status]||S.pending)+'</em></span><span class="mute">'+CM.fmt(r.ts)+'</span></div>').join("")+'</div>':'')},
 read(){const d={t:REG.v("rg-t"),team:REG.v("rg-n"),tag:REG.v("rg-a").toUpperCase(),country:REG.v("rg-c"),captain:REG.v("rg-k"),contact:REG.v("rg-w"),mail:REG.v("rg-e"),logo:REG.v("rg-l"),ok:!!($("#rg-ok")&&$("#rg-ok").checked),players:[]};
  for(let i=0;i<7;i++){const n=REG.v("rg-p"+i+"n"),id=REG.v("rg-p"+i+"i");if(n||id)d.players.push({n:n,id:id,r:REG.v("rg-p"+i+"r"),sub:i>=5})}return d},
 check(d){const e=(a,b,c)=>_(a,b,c);
  if(d.team.length<3)return e("Nama tim minimal 3 karakter.","Team name needs at least 3 characters.","Nama pasukan sekurang-kurangnya 3 aksara.");
  if(!/^[A-Z0-9]{2,6}$/.test(d.tag))return e("Singkatan harus 2-6 huruf/angka.","Tag must be 2-6 letters/digits.","Singkatan mesti 2-6 huruf/nombor.");
  if(d.captain.length<2)return e("Isi nama kapten.","Enter the captain name.","Isi nama kapten.");
  if(d.contact.length<5)return e("Isi kontak kapten (WhatsApp/Discord).","Enter the captain contact (WhatsApp/Discord).","Isi hubungan kapten (WhatsApp/Discord).");
  if(d.mail&&!/^\S+@\S+\.\S+$/.test(d.mail))return e("Format email tidak valid.","Invalid email format.","Format e-mel tidak sah.");
  if(d.logo&&!/^https?:\/\/\S+$/i.test(d.logo))return e("Link logo harus diawali http:// atau https://.","The logo link must start with http:// or https://.","Pautan logo mesti bermula dengan http:// atau https://.");
  const st=d.players.filter(p=>!p.sub);if(st.length<5||st.some(p=>!p.n||!/\d{5,}/.test(p.id)))return e("Lengkapi 5 pemain utama: nama IGN dan ID MLBB (minimal 5 angka).","Complete the 5 starters: IGN and MLBB ID (at least 5 digits).","Lengkapkan 5 pemain utama: nama IGN dan ID MLBB (sekurang-kurangnya 5 nombor).");
  if(d.players.some(p=>p.sub&&(!p.n||!/\d{5,}/.test(p.id))))return e("Pemain cadangan harus diisi lengkap atau dikosongkan.","Fill in the substitute fully or leave it empty.","Pemain simpanan mesti diisi lengkap atau dikosongkan.");
  const ns=d.players.map(p=>p.n.toLowerCase()),is=d.players.map(p=>p.id.replace(/\D/g,""));if(new Set(ns).size<ns.length||new Set(is).size<is.length)return e("Ada nama atau ID pemain yang dobel.","There is a duplicate player name or ID.","Ada nama atau ID pemain yang berganda.");

 get(){const d=REG.read(),er=REG.check(d);if(er){REG.note=er;REG.draw();scrollTo(0,0);return null}REG.note="";return d},

  if(Date.now()-REG.last<15000){REG.note=_("Tunggu beberapa detik sebelum mengirim lagi.","Wait a few seconds before submitting again.","Tunggu beberapa saat sebelum menghantar lagi.");REG.draw();return}
  if(REG.cfg){if(!REG.user){REG.note=_("Masuk dengan Google dulu untuk mengirim.","Sign in with Google first to submit.","Log masuk dengan Google dahulu untuk menghantar.");REG.draw();scrollTo(0,0);return}
   if(REG.mine.some(r=>r.t==d.t&&r.status!="rejected")){REG.note=_("Kamu sudah mendaftar di turnamen ini. Hubungi penyelenggara untuk perubahan.","You have already registered for this tournament. Contact the organizers for changes.","Anda sudah mendaftar dalam kejohanan ini. Hubungi penganjur untuk perubahan.");REG.draw();scrollTo(0,0);return}
   try{await REG.fs.collection("registrations").add(Object.assign({},d,{uid:REG.user.uid,account:REG.user.email||"",status:"pending",ts:firebase.firestore.FieldValue.serverTimestamp()}));REG.last=Date.now();REG.note="";toast(_("Pendaftaran terkirim! Status: Menunggu.","Registration sent! Status: Pending.","Pendaftaran dihantar! Status: Menunggu."));await REG.load();scrollTo(0,0)}

   REG.note=_("Tersimpan di perangkat ini saja. Kirim ke penyelenggara lewat WhatsApp/Email atau tombol Salin data.","Saved on this device only. Send it to the organizers via WhatsApp/Email or the Copy data button.","Disimpan pada peranti ini sahaja. Hantar kepada penganjur melalui WhatsApp/E-mel atau butang Salin data.");REG.draw();scrollTo(0,0)}},

  el.innerHTML=note+box('Masuk sebagai <b>'+who+'</b> · admin')+form+'<h2 class="lh" style="--c:#d4182f">Pendaftaran masuk</h2><div class="chips" style="margin:0 0 10px"><span class="chip">Total '+regs.length+'</span><span class="chip">Menunggu '+n("pending")+'</span><span class="chip">Diterima '+n("accepted")+'</span><span class="chip">Ditolak '+n("rejected")+'</span></div>'+list}};
