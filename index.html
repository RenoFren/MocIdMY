<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090e24;--card:#121a3f;--red:#d4182f;--red2:#6f0a1b;--blue:#1c4fd8;--blue2:#0a2168;--ink:#f4f6ff;--mute:#a9b3d6;--line:var(--w2);--w1:#ffffff0d;--w2:#ffffff1a;--w3:#ffffff33;--hb:rgba(9,14,36,.85);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,sans-serif;font-weight:800;line-height:1.05;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:var(--red2)}
.in{max-width:1080px;margin:auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px}
.brand img{height:56px;width:auto;border-radius:8px}
.sl{font:800 44px Oswald;color:var(--mute);transform:skewX(-14deg)}
nav{display:flex;gap:4px;overflow-x:auto;justify-content:center}
nav a{flex:none;padding:10px 14px;color:var(--mute);font-weight:700;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-image:var(--red) 1}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{padding:40px 0 24px;text-align:center}
.top h1{font-size:clamp(40px,9vw,72px)}.top p{color:var(--mute);max-width:52ch;margin:10px auto 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lg{display:flex;gap:18px;align-items:center;padding:28px 20px}
.lg img{width:110px;height:110px;object-fit:contain;flex:none;border-radius:10px}
.lg.ID{background:var(--red)}.lg.MY{background:var(--blue)}
.lg h2{font-size:34px}.lg p{font-size:14px;margin:6px 0;opacity:.9}.lg small{display:block;opacity:.8;margin-bottom:12px}
.ghost{display:inline-block;border:2px solid #fff;padding:6px 16px;font-weight:700;font-size:14px}
.ghost:hover{background:#fff;color:#090e24}
section{padding:30px 0 6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{font-size:32px}.sh a,.mute{color:var(--mute);font-size:14px}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border-left:6px solid var(--c);padding:14px 16px;margin-bottom:10px}
.mid{text-align:center;display:grid;font-size:13px;color:var(--mute)}.mid b{font:800 26px Oswald;color:#fff}.mid em{font-style:normal;color:#fff;font-weight:700}
.tm{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.tm.r{flex-direction:row-reverse;text-align:right}
.hx{flex:none;width:var(--s);height:var(--s);display:grid;place-items:center;font:800 calc(var(--s)*.4) Oswald;color:#10152f;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tl{flex:none;width:var(--s);height:var(--s);object-fit:contain;border-radius:50%;padding:calc(var(--s)*.08);border:2px solid var(--w3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two h3{font-size:24px;padding-bottom:6px;border-bottom:3px solid var(--c);margin-bottom:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.tw{overflow-x:auto}
.pg{padding:28px 0}.pg>h1{font-size:52px}.pg>p{color:var(--mute);margin:4px 0 20px}
.lh{font-size:30px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tc{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px}
.tc b{display:block}.tc span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.tab{background:var(--card);border:0;color:var(--mute);padding:8px 16px;font:700 14px Poppins;cursor:pointer}
.tab.on{background:#fff;color:#090e24}
.wk{font-size:28px;margin:22px 0 10px}
.card{background:var(--card);padding:20px;border-top:4px solid var(--c)}.card h3{font-size:26px;margin-bottom:6px}
footer{margin-top:44px;padding:26px 0 30px;background:var(--red2);color:var(--mute);font-size:14px}
footer .brand{justify-content:flex-start;padding:0 0 12px}footer .brand img{height:64px}
@media(max-width:760px){.split,.two{grid-template-columns:1fr}.lg img{width:84px;height:84px}.mr{padding:12px}.tm span{font-size:14px}.brand img{height:46px}nav{justify-content:flex-start}}
.vt-t{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.vt-n{background:var(--card);border-left:4px solid var(--red);padding:10px 14px;font-size:13px;color:var(--mute);margin:8px 0 14px}
.vp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.vp .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.vp b{display:block}.vp span.s{color:var(--mute);font-size:13px}.vb{border:2px solid #fff;background:none;color:#fff;padding:6px 14px;font:700 13px Poppins;cursor:pointer;min-width:92px}
.vb.on{background:#fff;color:#090e24}.vc{font:800 20px Oswald;margin-right:10px}.vr{display:flex;align-items:center}
.vw{display:flex;gap:6px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{padding:10px 0}.brand img{height:40px}.sl{font-size:30px}
nav{justify-content:flex-end;gap:2px}nav a{padding:8px 14px;border-bottom:0;border-radius:999px;font-size:14px}
nav a.on{background:var(--w2);color:#fff;border-image:none}
.hero{position:relative;padding:56px 0 34px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-30% -10% auto -10%;height:140%;background:#d4182f45,#1c4fd845;pointer-events:none}
.hero .in{position:relative}.eyebrow{letter-spacing:.18em;font-size:11px;color:var(--mute);text-transform:uppercase}
.hero h1{font-size:clamp(42px,9vw,84px);margin:10px 0 12px;max-width:14ch}.hero p{color:var(--mute);max-width:52ch}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--w3)}
.btn.p{background:var(--red);border-color:transparent}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lc{border-radius:14px;padding:22px;border:1px solid var(--line);background:var(--c)}
.lc .hd{display:flex;gap:14px;align-items:center}.lc img.lo{width:64px;height:64px;object-fit:contain;border-radius:12px;flex:none}
.lc h2{font-size:30px}.lc p{color:var(--mute);font-size:14px;margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.chip{font-size:12px;padding:3px 11px;border-radius:999px;background:var(--w1);color:var(--mute)}
.strip{display:flex;padding-left:8px}.strip .tl,.strip .hx{margin-left:-8px}
.empty{border:1px dashed var(--w3);border-radius:14px;padding:22px;text-align:center;color:var(--mute);font-size:14px}
.mr,.card,.tc,.vp{border-radius:14px}
.stc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* ===== TRANSISI HALAMAN: logo reveal + cincin warna (video referensi, 2x lebih cepat = 1.75s) ===== */
main{overflow-x:clip}
#ptx{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:#000;overflow:hidden;pointer-events:all;--sz:min(46vmin,380px)}
#ptx.on{display:grid;animation:ptxBg 1.75s linear both}
@keyframes ptxBg{0%,68%{opacity:1}100%{opacity:0}}
#ptx .lgo{width:var(--sz);height:var(--sz);object-fit:contain;display:block;animation:ptxLogo 1.75s cubic-bezier(.2,.8,.2,1) both;will-change:transform,clip-path}
@keyframes ptxLogo{0%{transform:scale(.03) rotate(-160deg);clip-path:circle(50%);opacity:0}5%{opacity:1}29%{transform:scale(1) rotate(0);clip-path:circle(50%)}41%{clip-path:circle(75%)}100%{transform:scale(1.04);clip-path:circle(75%)}}
#ptx .rg{position:absolute;left:50%;top:50%;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);opacity:0;animation:ptxRing .95s cubic-bezier(.45,.05,.85,.5) .4s both;will-change:transform}
#ptx .rg svg{width:100%;height:100%;overflow:visible;display:block}
@keyframes ptxRing{0%{opacity:0;transform:scale(.7) rotate(0)}12%{opacity:1}100%{opacity:1;transform:scale(9) rotate(70deg)}}
@media (prefers-reduced-motion:reduce){#ptx{display:none!important}}

/* ===== BANNER MOC ID x MOC MY ===== */
.mocb{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(120% 100% at 50% 0%,#141a33 0%,#0a0d12 62%);border-bottom:1px solid var(--line);padding:clamp(10px,2.4vw,26px) 0 clamp(4px,1.4vw,14px)}
.mocb:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(38% 62% at 27% 52%,rgba(229,56,59,.30),transparent 70%),radial-gradient(38% 62% at 73% 52%,rgba(47,109,246,.34),transparent 70%);animation:mbPulse 5s ease-in-out infinite}
.mocb .row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2px,2vw,28px);max-width:960px;margin:0 auto;padding:0 10px;align-items:center}
.mb{position:relative;isolation:isolate;aspect-ratio:1;width:100%;max-width:370px;margin:0 auto;animation:mbIn 1s cubic-bezier(.22,.8,.3,1) both}
.mb.my{animation-delay:.14s}
.mb .rays{position:absolute;inset:-14%;z-index:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(var(--g),.34) 0 2.5deg,transparent 2.5deg 14deg);-webkit-mask-image:radial-gradient(closest-side,#000 18%,transparent 74%);mask-image:radial-gradient(closest-side,#000 18%,transparent 74%);filter:blur(1.5px);animation:mbSpin 48s linear infinite}
.mb.my .rays{animation-direction:reverse}
.mb .halo{position:absolute;inset:10%;z-index:0;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--g),.8),rgba(var(--g),.2) 60%,transparent 76%);filter:blur(22px);animation:mbGlow 4.2s ease-in-out infinite}
.mb.my .halo{animation-delay:-2.1s}
.mb img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;animation:mbFloat 6s ease-in-out infinite}
.mb.my img{animation-delay:-3s}
.mb img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(0deg,transparent,#000 7%,#000 93%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent),linear-gradient(0deg,transparent,#000 7%,#000 93%,transparent);mask-composite:intersect}
.mb .shine{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;mix-blend-mode:overlay;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mb .shine:before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:46%;background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.95) 50%,transparent 72%);transform:translateX(-130%) skewX(-12deg);animation:mbShine 5s ease-in-out 1.2s infinite}
.mb.my .shine:before{animation-delay:3.6s}
@keyframes mbIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes mbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes mbGlow{0%,100%{opacity:.62;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
@keyframes mbPulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes mbSpin{to{transform:rotate(360deg)}}
@keyframes mbShine{0%{transform:translateX(-130%) skewX(-12deg)}38%,100%{transform:translateX(330%) skewX(-12deg)}}
@media (prefers-reduced-motion:reduce){.mocb:before,.mb,.mb .rays,.mb .halo,.mb img,.mb .shine:before{animation:none}}

.prs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.prs div{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.prs b{display:block;font:800 24px Oswald,sans-serif}.prs span{font-size:11px;color:var(--mute)}
.phr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:13px}
.phr .ok{color:#1f9d55;font-weight:700}.phr .no{color:#e5484d;font-weight:700}.phr .md{color:#d9a93a;font-weight:700}

/* ===== RANK GAME (ala MLBB) ===== */
.rkc{position:relative;overflow:hidden;border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--rc),#0b1233 85%);display:flex;gap:14px;align-items:center;margin:8px 0 12px}
.rkc:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.rkc svg{flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));animation:rkf 3s ease-in-out infinite}
@keyframes rkf{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.rkc h2{font-size:28px;margin:0}.rkc small{opacity:.85;font-size:12px;display:block}
.rkd{display:flex;gap:6px;margin:8px 0 2px}.rkd i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);font-style:normal;font-size:13px;line-height:16px;text-align:center}
.rkd i.f{background:#ffd23f;border-color:#fff;color:#7a4a00;box-shadow:0 0 8px #ffd23f}
.rkp{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin:10px 0 3px}.rkp i{display:block;height:100%;background:#ffd23f;transition:width .8s ease}
.rkr{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:10px;padding:9px 12px;margin:6px 0;font-size:13px}
.rkr.on{background:var(--w2);font-weight:700}
.rkr span{color:var(--mute);font-weight:400}
.rkn{animation:rkn .8s cubic-bezier(.22,.8,.3,1) both}@keyframes rkn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.stp{display:inline-block;font:800 16px Oswald,sans-serif;padding:2px 10px;border-radius:999px;margin:0 4px}
.stp.up{background:#1f9d5533;color:#1f9d55}.stp.dn{background:#e5484d33;color:#e5484d}

/* ===== TEAM RANKING (ala FIFA) ===== */
.trw{overflow-x:auto}
.trt{width:100%;border-collapse:collapse;min-width:520px}
.trt th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:10px 10px;text-align:center;border-bottom:1px solid var(--line)}
.trt td{padding:10px;text-align:center;border-bottom:1px solid var(--w1);font-size:14px}
.trt th:nth-child(3),.trt td:nth-child(3){text-align:left}
.trt tr:last-child td{border-bottom:0}
.trt .pt{font:800 18px Oswald,sans-serif}
.trt .up{color:#1f9d55;font-weight:700}.trt .dn{color:#e5484d;font-weight:700}.trt .eq{color:var(--mute)}
.trt tbody tr{animation:ptUp .4s both}
.tgp{font-weight:700;white-space:nowrap}.tgp.up{color:#1f9d55}.tgp.dn{color:#e5484d}
.tcl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcl label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.tcl select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--w3);border-radius:10px;padding:10px;font:inherit}
.tcr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tcr>div{background:var(--w1);border:1px solid var(--line);border-radius:12px;padding:12px}
.tcr h4{font:700 13px Poppins,sans-serif;margin:0 0 8px}
.tcr p{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}
@media (max-width:560px){.psg{grid-template-columns:1fr}.tcl,.tcr{grid-template-columns:1fr}.rkc h2{font-size:22px}}

/* ===== LIVE SCORE, FAVORIT, GRAFIK ===== */
.lvb{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;background:#e5484d;color:#fff;padding:7px 14px;font-size:13px;font-weight:600;animation:ptUp .4s both}
.lvb strong{font:800 16px Oswald,sans-serif;letter-spacing:.04em;margin:0 4px}
.lvi{display:inline-flex;align-items:center;gap:6px}.lvi b{font-size:11px;letter-spacing:.1em}
.lvd{width:9px;height:9px;border-radius:50%;background:#fff;animation:lvp 1.2s ease-in-out infinite}
@keyframes lvp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.mid em.live{color:#e5484d;font-weight:800;animation:lvp 1.4s infinite}
.psc.lk{opacity:.95}.scb:disabled{cursor:not-allowed;opacity:.7}.scb:disabled:hover{transform:none;border-color:var(--w3)}.scb.on:disabled{opacity:1}
.fvb{background:none;border:2px solid var(--w3);color:#ffb400;font:800 18px/1 Poppins,sans-serif;padding:4px 9px;cursor:pointer;border-radius:999px!important;transition:transform .15s,background .15s}
.fvb:hover{transform:scale(1.12)}.fvb.on{background:#ffb40022;border-color:#ffb400}
.fvb.big{font-size:13px;padding:6px 14px;margin-top:8px}
.fvr{display:flex;align-items:center;gap:8px}.fvr .tm{flex:1;min-width:0}
.fvc{display:inline-flex;align-items:center;gap:6px;background:var(--w1);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 8px;margin:2px 6px 2px 0;font-weight:700;color:var(--ink)}
.fvc button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px}
.lvc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.lvc>div{display:flex;align-items:center;gap:8px;background:var(--w1);border-radius:10px;padding:8px}
.lvc span{flex:1;font-weight:700}.lvc strong{font:800 22px Oswald,sans-serif;min-width:24px;text-align:center}.lvc .vb{min-width:0;padding:4px 12px}
@media (max-width:560px){.lvc{grid-template-columns:1fr}}

const RM={
 get(){try{return JSON.parse(localStorage.getItem("moc_rm")||"{}")}catch(e){return{}}},
 put(o){try{localStorage.setItem("moc_rm",JSON.stringify(o))}catch(e){}},
 key:m=>m[0]+"|"+m[2]+"|"+m[3]+"|"+m[4]+"|"+m[5],

 name:m=>(T[m[4]]?T[m[4]].a:m[4])+" vs "+(T[m[5]]?T[m[5]].a:m[5]),
 LEADS:[[0,["Saat mulai","At start time","Semasa mula"]],[15,["15 menit sebelum","15 minutes before","15 minit sebelum"]],[60,["1 jam sebelum","1 hour before","1 jam sebelum"]],[1440,["1 hari sebelum","1 day before","1 hari sebelum"]]],
 lbl(n){const x=RM.LEADS.find(l=>l[0]==n);return x?_(...x[1]):n+" min"},
 btn(m){const r=RM.get()[RM.key(m)],on=!!(r&&!r.fired);return '<button class="bell'+(on?' on':'')+'" data-k="'+esc(RM.key(m))+'" onclick="RM.open(this.dataset.k)" aria-label="'+_("Atur pengingat","Set reminder","Tetapkan peringatan")+'">'+(on?'🔔 '+_("Diatur","Set","Ditetapkan"):'🔔 '+_("Ingatkan","Remind me","Ingatkan"))+'</button>'},
 open(k){const m=RM.find(k);if(!m)return;const r=RM.get()[k];RM.dk=k;RM.sel=r?r.lead:15;RM.draw()},
 draw(){const m=RM.find(RM.dk);if(!m)return;const has=!!RM.get()[RM.dk];
  MD.show('<h3>🔔 '+_("Pengingat jadwal","Match reminder","Peringatan jadual")+'</h3><p class="mute" style="margin:6px 0 12px">'+esc(RM.name(m))+' · '+fd(m[2])+' · '+m[3]+' WIB</p><div class="rml">'
  +RM.LEADS.map(l=>'<button class="vb'+(l[0]==RM.sel?' on':'')+'" onclick="RM.sel='+l[0]+';RM.draw()">'+_(...l[1])+'</button>').join("")+'</div>'
  +'<p class="mute" style="font-size:12px;margin:12px 0">'+_("Notifikasi muncul saat situs atau aplikasi sedang terbuka. Untuk pengingat yang pasti berbunyi, tambahkan juga ke kalender HP.","Notifications appear while the site or app is open. For a reminder that is sure to ring, also add it to your phone calendar.","Pemberitahuan muncul semasa laman atau aplikasi dibuka. Untuk peringatan yang pasti berbunyi, tambahkan juga ke kalendar telefon.")+'</p>'
  +'<div class="rmb"><button class="vb on" onclick="RM.save()">'+_("Simpan pengingat","Save reminder","Simpan peringatan")+'</button><button class="vb" onclick="RM.ics()">📅 '+_("Tambah ke kalender","Add to calendar","Tambah ke kalendar")+'</button>'+(has?'<button class="vb" onclick="RM.del(RM.dk);MD.close()">'+_("Hapus","Delete","Padam")+'</button>':'')+'<button class="vb" onclick="MD.close()">'+_("Tutup","Close","Tutup")+'</button></div>')},
 async save(){const m=RM.find(RM.dk);if(!m||isNaN(RM.at(m))){MD.close();return}
  const o=RM.get();o[RM.dk]={lead:RM.sel,fired:0};RM.put(o);
  if("Notification"in window&&Notification.permission=="default"){try{await Notification.requestPermission()}catch(e){}}
  const ok="Notification"in window&&Notification.permission=="granted";MD.close();RM.refresh();
  toast(ok?_("Pengingat diatur: ","Reminder set: ","Peringatan ditetapkan: ")+RM.lbl(RM.sel)+" · "+RM.name(m):_("Pengingat tersimpan, tetapi notifikasi browser belum diizinkan. Gunakan tombol kalender agar tidak terlewat.","Reminder saved, but browser notifications are not allowed. Use the calendar button so you don't miss it.","Peringatan disimpan, tetapi pemberitahuan pelayar belum dibenarkan. Guna butang kalendar supaya tidak terlepas."));
  RM.check()},
 del(k){const o=RM.get();delete o[k];RM.put(o);RM.refresh()},
 ics(){const m=RM.find(RM.dk);if(!m)return;const st=RM.at(m),f=t=>new Date(t).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),nm=RM.name(m)+" - "+L[m[0]];
  const tx=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MOC Master Online Championship//ID","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:"+Date.now()+"-"+RM.dk.replace(/\W/g,"")+"@moctur.my.id","DTSTAMP:"+f(Date.now()),"DTSTART:"+f(st),"DTEND:"+f(st+72e5),"SUMMARY:"+nm,"DESCRIPTION:"+nm+" - Week "+m[1]+" ("+m[3]+" WIB)","BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+nm,"TRIGGER:"+(RM.sel?"-PT"+RM.sel+"M":"PT0S"),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([tx],{type:"text/calendar"}));a.download="moc-"+RM.name(m).replace(/\W+/g,"-").toLowerCase()+".ics";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},
 list(){const o=RM.get(),ks=Object.keys(o).filter(k=>RM.find(k)&&!o[k].fired).sort((a,b)=>RM.at(RM.find(a))-RM.at(RM.find(b)));
  return '<div id="rml">'+(ks.length?'<div class="vt-n"><b>🔔 '+_("Pengingat saya","My reminders","Peringatan saya")+'</b>'+ks.map(k=>{const m=RM.find(k);return '<div class="rmr"><span>'+esc(RM.name(m))+' · '+fd(m[2])+' · '+m[3]+' WIB <em class="tg">'+RM.lbl(o[k].lead)+'</em></span><button class="vb" style="min-width:0;padding:2px 10px" data-k="'+esc(k)+'" onclick="RM.del(this.dataset.k)" aria-label="'+_("Hapus","Delete","Padam")+'">✕</button></div>'}).join("")+'</div>':'')+'</div>'},
 refresh(){const o=RM.get();document.querySelectorAll(".bell").forEach(b=>{const m=RM.find(b.dataset.k);if(m)b.outerHTML=RM.btn(m)});const l=$("#rml");if(l)l.outerHTML=RM.list()},
 fire(m,r){const title="🎮 "+RM.name(m),body=(r.lead?_("Mulai ","Starts ","Bermula ")+m[3]+" WIB":_("Pertandingan dimulai sekarang","The match starts now","Perlawanan bermula sekarang"))+" · "+L[m[0]];
  toast(title+" — "+body);
  if("Notification"in window&&Notification.permission=="granted"){const opt={body:body,icon:"icon-192.png",badge:"icon-192.png",tag:RM.key(m),data:{url:"./#schedule"}};
   const fb=()=>{try{new Notification(title,opt)}catch(e){}};
   if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(g=>g?g.showNotification(title,opt):fb()).catch(fb);else fb()}},
 check(){const o=RM.get(),now=Date.now();let ch=0;
  Object.keys(o).forEach(k=>{const m=RM.find(k),r=o[k];
   if(!m){if(!r.seen){r.seen=now;ch=1}else if(now-r.seen>864e5){delete o[k];ch=1}return}
   const st=RM.at(m);if(isNaN(st))return;
   if(r.fired){if(now>st+216e5){delete o[k];ch=1}return}
   if(now>=st-r.lead*6e4){r.fired=1;ch=1;if(now<=st+108e5)RM.fire(m,r)}});
  if(ch){RM.put(o);RM.refresh()}},
 start(){RM.check();setInterval(RM.check,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)RM.check()});addEventListener("keydown",e=>{if(e.key=="Escape")MD.close()})}};

/* ---------- 1. TRANSISI SETIAP GANTI MENU (logo reveal + cincin, 2x lebih cepat) ---------- */
const PT={last:undefined,t:0,busy:0,swapped:0,
 key:()=>(location.hash||"#home").slice(1).split("/")[0],
 alias:{team:"teams",player:"players"},
 order(){return [...document.querySelectorAll("#nav a")].map(a=>a.getAttribute("href").slice(1).split("/")[0])},
 el(){let e=document.getElementById("ptx");if(!e){const ring=(c,o)=>'<circle cx="100" cy="100" r="90" stroke="'+c+'" stroke-dasharray="36 105.4" stroke-dashoffset="'+o+'"/>';
  document.body.insertAdjacentHTML("beforeend",'<div id="ptx" aria-hidden="true"><img class="lgo" alt="" src="'+LOGO_ID+'"><div class="rg"><svg viewBox="0 0 200 200"><g fill="none" stroke-width="10" transform="rotate(-90 100 100)">'+ring("#ef2b2d",0)+ring("#1b4fd8",-47)+ring("#ffa800",-94)+'</g></svg></div></div>');e=document.getElementById("ptx")}return e},
 run(){const app=$("#app"),to=PT.key(),from=PT.last;PT.last=to;
  const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(calm||from===undefined||!app.firstChild){go();return}
  if(PT.busy){if(PT.swapped)go();return}
  const e=PT.el();PT.busy=1;PT.swapped=0;
  e.classList.remove("on");void e.offsetWidth;e.classList.add("on");
  clearTimeout(PT.t);
  PT.t=setTimeout(()=>{go();PT.swapped=1},650);
  setTimeout(()=>{e.classList.remove("on");PT.busy=0},1780)}};
PT.el();
PT.last=PT.key();

/* ---------- 2. PREDIKSI SKOR ---------- */
/* Format pertandingan: otomatis Bo3 (menang 2 game). Jika di liga yang sama pernah ada skor 3 ke atas, dipakai Bo5. */
PD.win=m=>{let w=2;M.forEach(x=>{if(x[0]==m[0]&&x[6]=="done"&&x[7]!==undefined&&x[7]!==""&&x[8]!==undefined&&x[8]!==""){w=Math.max(w,+x[7]||0,+x[8]||0)}});return Math.min(3,w)};
PD.opts=m=>{const w=PD.win(m),a=[],b=[];for(let k=0;k<w;k++){a.push(w+"-"+k);b.push(k+"-"+w)}return [a,b.reverse()]};
PD.isS=v=>/^\d+-\d+$/.test(v||"");
PD.cntS=(k,s)=>Object.values(PD.votes).filter(v=>v[k]==s).length;
PD.pick=async function(k,s){if(PD.cfg&&!PD.user){PD.note=_("Masuk dengan Google dulu untuk memprediksi.","Sign in with Google first to predict.","Log masuk dengan Google dahulu untuk meramal.");PD.draw();return}
 const n={...PD.mine};if(n[k]==s)delete n[k];else n[k]=s;PD.mine=n;
 if(PD.cfg){PD.votes[PD.user.uid]=n;try{await PD.fs.collection("predictions").doc(PD.user.uid).set(n);PD.note=""}catch(e){PD.note=_("Prediksi belum tersimpan. Coba lagi.","Prediction not saved. Try again.","Ramalan belum disimpan. Cuba lagi.")}}
 else{PD.votes.me=n;try{localStorage.setItem("moc_pred",JSON.stringify(n))}catch(e){}}PD.draw()};
PD.score=function(m){const k=PD.mk(m),[ga,gb]=PD.opts(m),tot=[...ga,...gb].reduce((t,s)=>t+PD.cntS(k,s),0),mine=PD.mine[k],lock=LV.locked(m);
 const btn=s=>{const c=PD.cntS(k,s),p=tot?Math.round(100*c/tot):0;return '<button type="button"'+(lock?' disabled':'')+' class="scb'+(mine==s?' on':'')+'" aria-pressed="'+(mine==s)+'" onclick="PD.pick(\''+esc(k)+'\',\''+s+'\')">'+s.replace("-"," : ")+'<small>'+p+'%</small><i style="width:'+p+'%"></i></button>'};
 const best=[...ga,...gb].map(s=>[s,PD.cntS(k,s)]).sort((x,y)=>y[1]-x[1])[0];
 const wa=ga.reduce((t,s)=>t+PD.cntS(k,s),0),wb=tot-wa;
 return '<div class="psc'+(lock?' lk':'')+'"><div class="psh"><span>'+L[m[0]]+' · Week '+m[1]+'</span><span>'+fd(m[2])+' · '+m[3]+' WIB'+(lock?' · <b style="color:'+(m[6]=="live"?'#e5484d':'inherit')+'">'+(m[6]=="live"?'🔴 LIVE '+LV.sc(m):'🔒 '+_("Terkunci","Locked","Dikunci"))+'</b>':(LV.cd(m)?' · ⏳ '+LV.cd(m):''))+'</span></div>'
 +'<div class="psv"><div class="t">'+hx(m[4],34)+'<span>'+esc(T[m[4]].n)+'</span></div><em>VS</em><div class="t r">'+hx(m[5],34)+'<span>'+esc(T[m[5]].n)+'</span></div></div>'
 +'<div class="psg"><div><b>'+_("Menang","Win","Menang")+' '+esc(T[m[4]].a)+'</b><div class="psr" style="grid-template-columns:repeat('+ga.length+',1fr)">'+ga.map(btn).join("")+'</div></div>'
 +'<div><b>'+_("Menang","Win","Menang")+' '+esc(T[m[5]].a)+'</b><div class="psr" style="grid-template-columns:repeat('+gb.length+',1fr)">'+gb.map(btn).join("")+'</div></div></div>'
 +'<div class="pcm"><span>'+(mine&&PD.isS(mine)?_("Tebakanmu: ","Your pick: ","Tekaan anda: ")+'<b>'+esc(T[m[4]].a)+' '+mine.replace("-"," : ")+' '+esc(T[m[5]].a)+'</b>':(lock?_("🔒 Prediksi terkunci karena pertandingan sudah dimulai.","🔒 Predictions are locked because the match has started.","🔒 Ramalan dikunci kerana perlawanan sudah bermula."):_("Pilih skor akhir. Tekan lagi untuk membatalkan.","Pick the final score. Tap again to cancel.","Pilih skor akhir. Tekan lagi untuk membatalkan.")))+'</span>'
 +'<span>'+(tot?_("Terbanyak: ","Most picked: ","Terbanyak: ")+'<b>'+best[0].replace("-"," : ")+'</b> · '+esc(T[m[4]].a)+' '+Math.round(100*wa/tot)+'% / '+esc(T[m[5]].a)+' '+Math.round(100*wb/tot)+'% · ':"")+tot+' '+_("prediksi","predictions","ramalan")+'</span></div></div>'};
PD.hist=function(){const out=[];let ex=0,ok=0,no=0;
 M.forEach(m=>{if(m[6]!="done"||!T[m[4]]||!T[m[5]])return;const k=PD.mk(m),v=PD.mine[k];if(!PD.isS(v))return;
  const a=+m[7],b=+m[8];if(m[7]===""||m[8]===""||m[7]===undefined||m[8]===undefined||isNaN(a)||isNaN(b)||a==b)return;
  const [pa,pb]=v.split("-").map(Number),exact=pa==a&&pb==b,win=(pa>pb)==(a>b);
  if(exact)ex++;else if(win)ok++;else no++;out.push({m,v,a,b,r:exact?2:win?1:0})});
 if(!out.length)return "";
 const pts=ex*3+ok,n=out.length;
 return '<h2 style="font-size:24px;margin:22px 0 4px">'+_("Hasil Prediksimu","Your Results","Keputusan Ramalan Anda")+'</h2>'
 +'<div class="prs"><div><b>'+pts+'</b><span>'+_("Poin","Points","Mata")+'</span></div><div><b>'+ex+'</b><span>'+_("Skor tepat","Exact score","Skor tepat")+'</span></div><div><b>'+ok+'</b><span>'+_("Pemenang benar","Right winner","Pemenang betul")+'</span></div><div><b>'+Math.round(100*(ex+ok)/n)+'%</b><span>'+_("Akurasi","Accuracy","Ketepatan")+'</span></div></div>'
 +'<p class="mute" style="font-size:12px;margin:0 0 6px">'+_("Skor tepat = 3 poin, pemenang benar = 1 poin.","Exact score = 3 points, right winner = 1 point.","Skor tepat = 3 mata, pemenang betul = 1 mata.")+'</p>'
 +out.reverse().slice(0,12).map(o=>'<div class="phr"><span>'+esc(T[o.m[4]].a)+' <b>'+o.a+' : '+o.b+'</b> '+esc(T[o.m[5]].a)+'</span><span>'+_("Tebakanmu","Your pick","Tekaan anda")+' '+o.v.replace("-"," : ")+'</span><span class="'+(o.r==2?'ok':o.r==1?'md':'no')+'">'+(o.r==2?'🎯 +3':o.r==1?'✅ +1':'❌ 0')+'</span></div>').join("")};
PD.draw=function(){const el=$("#pd");if(!el)return;const up=sorted().filter(m=>(m[6]=="upcoming"||m[6]=="live")&&T[m[4]]&&T[m[5]]).sort((a,b)=>(b[6]=="live")-(a[6]=="live"));

/* ---------- 3. RANK GAME ala MLBB ---------- */
/* Epic V-I (5 bintang per divisi) -> Legend V-I (5 bintang per divisi) -> Mythic ★0-24 -> Mythic Honor ★25-49 -> Mythic Glory ★50-99 -> Mythic Immortal ★100 dst.
   Menang +1 bintang, kalah -1 bintang. Seri tidak mengubah bintang. Bintang total disimpan di perangkat (moc_stars). */
const RK={
 tiers:["Epic","Legend","Mythic","Mythic Honor","Mythic Glory","Mythic Immortal"],
 col:["#a855f7","#38bdf8","#ff5d3a","#ff9f1c","#f5c518","#f43f9e"],
 start:[0,25,50,75,100,150],
 rng:["Epic V – I","Legend V – I","★ 0 – 24","★ 25 – 49","★ 50 – 99","★ 100+"],
 hard:["Mudah","Sedang","Sulit","Sangat sulit","Brutal","Mustahil"],
 rom:["V","IV","III","II","I"],
 sym:["","","M","MH","MG","MI"],uid:0,
 get(){try{return Math.max(0,parseInt(localStorage.getItem("moc_stars"))||0)}catch(e){return 0}},
 set(n){try{localStorage.setItem("moc_stars",String(n))}catch(e){}},
 peak(){try{return Math.max(0,parseInt(localStorage.getItem("moc_peak"))||0)}catch(e){return 0}},
 info(s){const D=5;let t,st,nx=null,div="",lab;
  if(s<25){t=0;const d=Math.floor(s/D);div=RK.rom[d];st=s%D;lab="Epic "+div;nx=(d+1)*D}
  else if(s<50){t=1;const q=s-25,d=Math.floor(q/D);div=RK.rom[d];st=q%D;lab="Legend "+div;nx=25+(d+1)*D}
  else{const m=s-50;t=m<25?2:m<50?3:m<100?4:5;st=m;lab=RK.tiers[t]+" ★"+m;nx=t==2?75:t==3?100:t==4?150:null}
  return {s,t,div,st,lab,nx}},
 full:i=>i.lab+(i.t<2?" ("+i.st+"/5 ★)":""),
 apply(res){const b=RK.get(),pk=RK.peak();let a=b;
  if(res>0)a=b+1;else if(res<0)a=Math.max(pk>=50?50:0,b-1);   // sudah masuk Mythic: tidak turun lagi ke Legend
  RK.set(a);if(a>pk){try{localStorage.setItem("moc_peak",String(a))}catch(e){}}
  return {b,a,ib:RK.info(b),ia:RK.info(a)}},
 begin(){RK.settle();try{localStorage.setItem("moc_pend","1")}catch(e){}},
 done(){try{localStorage.removeItem("moc_pend")}catch(e){}},
 settle(){let p=0;try{p=localStorage.getItem("moc_pend")}catch(e){}if(p){RK.done();const r=RK.apply(-1);if(r.a<r.b)toast(_("Keluar di tengah match dihitung kalah: -1 bintang.","Leaving mid-match counts as a loss: -1 star.","Keluar di tengah perlawanan dikira kalah: -1 bintang."));return r}return null},
 mulAt(s){const i=RK.info(s);let m=DU.mul[i.t];if(i.t==5)m+=Math.min(.25,Math.max(0,s-150)*.005);return m},
 badge(i,sz){const c=RK.col[i.t],id="rb"+(++RK.uid),tx=i.t<2?i.div:RK.sym[i.t];
  return '<svg viewBox="0 0 64 72" width="'+sz+'" height="'+Math.round(sz*72/64)+'" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'"/><stop offset="1" stop-color="#0b1233"/></linearGradient></defs><path d="M32 3 58 13v24c0 16-11 27-26 32C17 64 6 53 6 37V13z" fill="url(#'+id+')" stroke="#fff" stroke-opacity=".75" stroke-width="2.5"/>'+(i.t>=2?'<path d="M18 22l7 7 7-11 7 11 7-7-3 12H21z" fill="#fff" fill-opacity=".9"/>':'')+'<text x="32" y="'+(i.t>=2?52:46)+'" text-anchor="middle" font-family="Oswald,Arial,sans-serif" font-weight="800" font-size="'+(tx.length>2?18:tx.length>1?22:26)+'" fill="#fff" stroke="#0b1233" stroke-width=".6">'+tx+'</text></svg>'},
 card(i){const c=RK.col[i.t];let body;
  if(i.t<2){body='<div class="rkd" aria-label="'+i.st+' / 5 bintang">'+[0,1,2,3,4].map(n=>'<i class="'+(n<i.st?'f':'')+'">'+(n<i.st?'★':'')+'</i>').join("")+'</div><small>'+i.st+' / 5 '+_("bintang","stars","bintang")+' · '+_("Berikutnya: ","Next: ","Seterusnya: ")+esc(RK.info(i.nx).lab)+'</small>'}
  else{const a=RK.start[i.t],pc=i.nx?Math.round(100*(i.s-a)/(i.nx-a)):100;body='<div class="rkp"><i style="width:'+pc+'%"></i></div><small>★ '+i.st+(i.nx?' · '+_("menuju ","next: ","menuju ")+esc(RK.info(i.nx).lab.replace(/ ★\d+$/,"")):' · '+_("tanpa batas, terus naik!","no limit, keep climbing!","tanpa had, terus naik!"))+'</small>'}
  return '<div class="rkc" style="--rc:'+c+'">'+RK.badge(i,78)+'<div style="position:relative;min-width:0;flex:1"><small>'+_("Rank kamu","Your rank","Pangkat anda")+'</small><h2>'+esc(i.lab)+'</h2>'+body+'</div></div>'}};

 if(u.en>=100&&Math.random()<(hard?.6+(rank-2)*.1:.5+rank*.08))return "U";
 if(h.length&&Math.random()<p){const w={A:0,S:0,G:0,U:0};

 return r<.4?"A":r<.75?"S":"G"};

/* ---------- 4. TEAM RANKING ala FIFA ---------- */
/* Rumus mirip FIFA: perubahan poin = I x (W - We). We = 1 / (10^(-selisihPoin/600) + 1).
   Tim papan atas kalah dari tim bawah -> kehilangan poin besar; tim bawah menang atas tim atas -> dapat poin besar.
   Tim papan atas menang atas tim bawah -> poin kecil; tim bawah kalah dari tim atas -> kehilangan sedikit.
   I (bobot): liga 8, cup 10, ASEAN Cup / Club World Cup 12. Margin skor: selisih 2 game x1.25, 3+ game x1.5.
   Poin awal: semua tim 0 (tanpa bonus gelar). Poin tidak pernah di bawah 0, jadi tim yang kalah tetap 0. Bisa diubah per tim dengan T.KODE.rp = angka. */
const TR={base:0,
 imp:l=>({ID:8,MY:8,AC:12,CID:10,CMY:10,CWC:12}[l]||8),
 mg:d=>d>=3?1.5:d==2?1.25:1,
 we:dr=>1/(Math.pow(10,-dr/600)+1),
 seed(k){if(T[k]&&typeof T[k].rp=="number")return T[k].rp;return TR.base},
 delta(pa,pb,wa,i,mg){const e=TR.we(pa-pb),d=i*mg*(wa-e);return d},
 run(skipDate){const R={},log=[],steps=[];Object.keys(T).forEach(k=>R[k]={k,p:TR.seed(k),m:0,w:0,l:0,d:0,h:[],best:0});Object.values(R).forEach(r=>r.h.push({p:r.p}));TR.snap(R,steps,"");
  const ms=sorted().filter(x=>x[6]=="done"&&R[x[4]]&&R[x[5]]&&x[4]!=x[5]&&x[7]!==undefined&&x[7]!==""&&x[8]!==undefined&&x[8]!==""&&!isNaN(+x[7])&&!isNaN(+x[8])&&+x[7]!=+x[8]);
  ms.forEach(x=>{if(skipDate&&x[2]>=skipDate)return;const A=R[x[4]],B=R[x[5]],a=+x[7],b=+x[8],wa=a>b?1:0,i=TR.imp(x[0]),mg=TR.mg(Math.abs(a-b)),
   d0=TR.delta(A.p,B.p,wa,i,mg),da=Math.max(d0,-A.p),db=Math.max(-d0,-B.p);log.push({x,a:x[4],b:x[5],sa:a,sb:b,da,db,pa:A.p,pb:B.p});
   A.p+=da;B.p+=db;A.m++;B.m++;A.d=da;B.d=db;if(wa){A.w++;B.l++}else{B.w++;A.l++}A.h.push({d:x[2],p:A.p,o:x[5],s:a+"-"+b,dp:da,w:wa});B.h.push({d:x[2],p:B.p,o:x[4],s:b+"-"+a,dp:db,w:wa?0:1});TR.snap(R,steps,x[2])});
  return {R,log,steps,n:ms.length,last:ms.length?ms[ms.length-1][2]:""}},
 pools(R){const l=Object.values(R),club=l.filter(r=>T[r.k].l!="AC").sort((a,b)=>b.p-a.p||T[a.k].n.localeCompare(T[b.k].n)),ac=l.filter(r=>T[r.k].l=="AC").sort((a,b)=>b.p-a.p||T[a.k].n.localeCompare(T[b.k].n));return {club,ac}},
 f(n,sg){let s=Math.abs(n).toFixed(2);if(LANG!="en")s=s.replace(".",",");return (sg?(n>=0?"+":"-"):(n<0?"-":""))+s},
 tab:"club",
 view(t){TR.tab=t;const a=$("#app");if(a&&PT.key()=="ranking")a.innerHTML=pages.ranking()},
 sim(){const a=$("#tr-a"),b=$("#tr-b"),o=$("#tr-o");if(!a||!b||!o)return;const A=a.value,B=b.value;
  if(A==B){o.innerHTML='<p class="mute" style="grid-column:1/-1;margin:0">'+_("Pilih dua tim yang berbeda.","Pick two different teams.","Pilih dua pasukan yang berbeza.")+'</p>';return}
  const {R}=TR.run(),pa=R[A].p,pb=R[B].p,I=8,w=(X,Y,x,y)=>{const win=TR.delta(x,y,1,I,1),lose=Math.max(TR.delta(x,y,0,I,1),-x);return '<div><h4>'+esc(T[X].n)+'</h4><p><span>'+_("Jika menang","If wins","Jika menang")+'</span><b class="tgp up">'+TR.f(win,1)+'</b></p><p><span>'+_("Jika kalah","If loses","Jika kalah")+'</span><b class="tgp dn">'+TR.f(lose,1)+'</b></p><p><span>'+_("Poin sekarang","Current points","Mata sekarang")+'</span><b>'+TR.f(x)+'</b></p></div>'};
  o.innerHTML=w(A,B,pa,pb)+w(B,A,pb,pa)}};
pages.ranking=()=>{const cur=TR.run(),prv=TR.run(cur.last),{club,ac}=TR.pools(cur.R),pp=TR.pools(prv.R);
 const pos=(arr,k)=>arr.findIndex(r=>r.k==k)+1;
 const tabs=[["club",_("Semua Klub","All Clubs","Semua Kelab")],...["ID","MY"].filter(l=>club.some(r=>T[r.k].l==l)).map(l=>[l,L[l]||l])];

  +rows.map((r,i)=>{const rk=pos(base,r.k),pr=pos(prevArr,r.k),mv=!cur.n||!prv.n||r.m==0?0:pr-rk;
   return '<tr style="animation-delay:'+Math.min(i,14)*.03+'s"><td><b class="rk">'+rk+'</b></td><td class="'+(mv>0?'up':mv<0?'dn':'eq')+'">'+(mv>0?'▲ '+mv:mv<0?'▼ '+(-mv):'–')+'</td><td><div class="fvr"><a href="#team/'+encodeURIComponent(r.k)+'" class="tm">'+hx(r.k,30)+'<span class="tn">'+esc(T[r.k].n)+'<small>'+esc(T[r.k].a)+'</small></span></a>'+FV.btn(r.k)+'</div></td><td class="pt">'+TR.f(r.p)+'</td><td>'+r.m+'</td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+(r.m?'<span class="tgp '+(r.d>=0?'up':'dn')+'">'+TR.f(r.d,1)+'</span>':'<span class="eq">–</span>')+'</td></tr>'}).join("")+'</tbody></table></div></div>'
  :empty(_("Belum ada tim.","No teams yet.","Belum ada pasukan."));
 const opts=sel=>club.map(r=>'<option value="'+esc(r.k)+'"'+(r.k==sel?' selected':'')+'>'+esc(T[r.k].n)+'</option>').join("");
 const sa=club[0]&&club[0].k,sb=club[Math.min(club.length-1,Math.max(1,Math.floor(club.length/2)))]&&club[Math.min(club.length-1,Math.max(1,Math.floor(club.length/2)))].k;
