<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090e24;--card:#121a3f;--red:#d4182f;--red2:#6f0a1b;--blue:#1c4fd8;--blue2:#0a2168;--ink:#f4f6ff;--mute:#a9b3d6;--line:#ffffff1f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Oswald,sans-serif;font-weight:800;line-height:1.05;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--red2),var(--bg) 35%,var(--bg) 65%,var(--blue2))}
.in{max-width:1080px;margin:auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px}
.brand img{height:56px;width:auto;border-radius:8px}
.sl{font:800 44px Oswald;color:var(--mute);transform:skewX(-14deg)}
nav{display:flex;gap:4px;overflow-x:auto;justify-content:center}
nav a{flex:none;padding:10px 14px;color:var(--mute);font-weight:700;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-image:linear-gradient(90deg,var(--red),var(--blue)) 1}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.top{padding:40px 0 24px;text-align:center}
.top h1{font-size:clamp(40px,9vw,72px)}.top p{color:var(--mute);max-width:52ch;margin:10px auto 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lg{display:flex;gap:18px;align-items:center;padding:28px 20px}
.lg img{width:110px;height:110px;object-fit:contain;flex:none;border-radius:10px}
.lg.ID{background:linear-gradient(160deg,var(--red),var(--red2))}.lg.MY{background:linear-gradient(200deg,var(--blue),var(--blue2))}
.lg h2{font-size:34px}.lg p{font-size:14px;margin:6px 0;opacity:.9}.lg small{display:block;opacity:.8;margin-bottom:12px}
.ghost{display:inline-block;border:2px solid #fff;padding:6px 16px;font-weight:700;font-size:14px}
.ghost:hover{background:#fff;color:#090e24}
section{padding:30px 0 6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sh h2{font-size:32px}.sh a,.mute{color:var(--mute);font-size:14px}
.mr{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--card);border-left:6px solid var(--c);padding:14px 16px;margin-bottom:10px}
.mid{text-align:center;display:grid;font-size:13px;color:var(--mute)}.mid b{font:800 26px Oswald;color:#fff}.mid em{font-style:normal;color:#fff;font-weight:700}
.tm{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.tm.r{flex-direction:row-reverse;text-align:right}
.hx{flex:none;width:var(--s);height:var(--s);display:grid;place-items:center;font:800 calc(var(--s)*.4) Oswald;color:#10152f;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tl{flex:none;width:var(--s);height:var(--s);object-fit:contain;border-radius:50%;padding:calc(var(--s)*.08);border:2px solid #ffffff33}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two h3{font-size:24px;padding-bottom:6px;border-bottom:3px solid var(--c);margin-bottom:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.tw{overflow-x:auto}
.pg{padding:28px 0}.pg>h1{font-size:52px}.pg>p{color:var(--mute);margin:4px 0 20px}
.lh{font-size:30px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tc{display:flex;align-items:center;gap:14px;background:var(--card);padding:14px}
.tc b{display:block}.tc span{color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
.tab{background:var(--card);border:0;color:var(--mute);padding:8px 16px;font:700 14px Poppins;cursor:pointer}
.tab.on{background:#fff;color:#090e24}
.wk{font-size:28px;margin:22px 0 10px}
.card{background:var(--card);padding:20px;border-top:4px solid var(--c)}.card h3{font-size:26px;margin-bottom:6px}
footer{margin-top:44px;padding:26px 0 30px;background:linear-gradient(90deg,var(--red2),var(--bg) 40%,var(--bg) 60%,var(--blue2));color:var(--mute);font-size:14px}
footer .brand{justify-content:flex-start;padding:0 0 12px}footer .brand img{height:64px}
@media(max-width:760px){.split,.two{grid-template-columns:1fr}.lg img{width:84px;height:84px}.mr{padding:12px}.tm span{font-size:14px}.brand img{height:46px}nav{justify-content:flex-start}}
.vt-t{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.vt-n{background:var(--card);border-left:4px solid var(--red);padding:10px 14px;font-size:13px;color:var(--mute);margin:8px 0 14px}
.vp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden}
.vp .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue))}
.vp b{display:block}.vp span.s{color:var(--mute);font-size:13px}.vb{border:2px solid #fff;background:none;color:#fff;padding:6px 14px;font:700 13px Poppins;cursor:pointer;min-width:92px}
.vb.on{background:#fff;color:#090e24}.vc{font:800 20px Oswald;margin-right:10px}.vr{display:flex;align-items:center}
.vw{display:flex;gap:6px;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(9,14,36,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{padding:10px 0}.brand img{height:40px}.sl{font-size:30px}
nav{justify-content:flex-end;gap:2px}nav a{padding:8px 14px;border-bottom:0;border-radius:999px;font-size:14px}
nav a.on{background:#ffffff1a;color:#fff;border-image:none}
.hero{position:relative;padding:56px 0 34px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-30% -10% auto -10%;height:140%;background:radial-gradient(40% 50% at 15% 30%,#d4182f45,transparent),radial-gradient(40% 50% at 85% 20%,#1c4fd845,transparent);pointer-events:none}
.hero .in{position:relative}.eyebrow{letter-spacing:.18em;font-size:11px;color:var(--mute);text-transform:uppercase}
.hero h1{font-size:clamp(42px,9vw,84px);margin:10px 0 12px;max-width:14ch}.hero p{color:var(--mute);max-width:52ch}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid #ffffff40}
.btn.p{background:linear-gradient(90deg,var(--red),var(--blue));border-color:transparent}
.lgs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lc{border-radius:14px;padding:22px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),var(--card) 72%)}
.lc .hd{display:flex;gap:14px;align-items:center}.lc img.lo{width:64px;height:64px;object-fit:contain;border-radius:12px;flex:none}
.lc h2{font-size:30px}.lc p{color:var(--mute);font-size:14px;margin:12px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.chip{font-size:12px;padding:3px 11px;border-radius:999px;background:#ffffff14;color:var(--mute)}
.strip{display:flex;padding-left:8px}.strip .tl,.strip .hx{margin-left:-8px}
.empty{border:1px dashed #ffffff33;border-radius:14px;padding:22px;text-align:center;color:var(--mute);font-size:14px}
.mr,.card,.tc,.vp{border-radius:14px}
.stc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sth{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sth i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.two .sth h3{font-size:22px;flex:1;border:0;padding:0;margin:0}.sth span{color:var(--mute);font-size:12px}
.stt th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
.stt th:nth-child(2),.stt td:nth-child(2){text-align:left}
.stt td{padding:11px 12px;text-align:center;border-bottom:1px solid #ffffff0d}
.stt tr:last-child td{border-bottom:0}.stt tr:hover td{background:#ffffff08}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:600 13px Oswald;background:#ffffff12}
.stt tr:nth-child(2) .rk{background:var(--c)}
.tn{display:grid;line-height:1.2;font-weight:600;font-size:14px}.tn small{color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.08em}
.lg-note{font-size:11px;color:var(--mute);padding:10px 18px 14px}
.vcta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px;border-radius:14px;background:linear-gradient(90deg,#d4182f33,#1c4fd833);border:1px solid var(--line)}
.vcta h2{font-size:28px}.vcta p{color:var(--mute);font-size:14px;margin-top:4px}
.mr .a{display:none}
@media(max-width:760px){.lgs{grid-template-columns:1fr}.hero{padding:34px 0 22px}.mr .n{display:none}.mr .a{display:inline}.two{gap:16px}nav{justify-content:flex-start;width:100%}}

.hd2{display:flex;gap:14px;align-items:center}.hd2 .lo{width:64px;height:64px;object-fit:contain;border-radius:12px;flex:none}
.lc.pro{grid-column:1/-1;display:block;color:inherit}
.pz{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;margin:8px 0}
.pz b{display:block;font-size:14px}.pz span{color:var(--mute);font-size:13px}.pl{flex:none;display:grid;place-items:center;width:40px;height:40px}
.pz .res,.tc .res{color:#e8c25a;font-weight:600;font-size:12.5px}.pz .res.off{color:var(--mute);font-weight:500}.tc .res{display:block}
.tg{margin-left:auto;font-style:normal;font-size:11px;padding:3px 10px;border-radius:999px;background:#ffffff14;color:var(--mute);white-space:nowrap}

section.in{padding:28px 16px 4px}.pg.in{padding:28px 16px}.top.in{padding:40px 16px 24px}
.cmf{display:grid;gap:8px;margin-bottom:16px}.cmf textarea,.cmf input[type=text],.cmf input:not([type]){width:100%;box-sizing:border-box;background:#ffffff0d;border:1px solid #ffffff26;border-radius:10px;color:inherit;padding:10px;font:inherit}.cmb{display:flex;justify-content:space-between;align-items:center;gap:10px}.cmb label{font-size:13px}.cmi{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:12px;padding:12px;margin-bottom:10px}.cmi.rm{border-color:#d9a93a88}.cmi p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}.cmh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cmh .mute{font-size:12px}
.tgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:22px}.tbx{background:#ffffff0d;border:1px solid #ffffff1a;border-top:3px solid var(--c);border-radius:14px;padding:14px}.tbh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.tbh b{display:block}.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff14}.pr em{font-style:normal;font-size:12px;color:var(--mute)}
</style></head><body>

const CM={items:[],user:null,cfg:false,note:"",last:0,rumor:false,draft:"",nm:"",
init(){CM.local();CM.draw();
 try{if(window.firebase&&FB.apiKey&&FB.apiKey.indexOf("ISI_")!=0){CM.cfg=true;if(!firebase.apps.length)firebase.initializeApp(FB);CM.fs=firebase.firestore();CM.items=[];
  firebase.auth().onAuthStateChanged(u=>{CM.user=u;CM.draw()});
  CM.fs.collection("comments").orderBy("ts","desc").limit(100).onSnapshot(sn=>{CM.items=sn.docs.map(d=>Object.assign({id:d.id},d.data()));CM.draw()},()=>{CM.cfg=false;CM.local();CM.draw()})}}catch(e){CM.cfg=false}},

login(){if(!CM.cfg)return;const p=new firebase.auth.GoogleAuthProvider();
 firebase.auth().signInWithPopup(p).then(()=>{CM.note=""}).catch(e=>{if(e&&e.code&&e.code.indexOf("popup")>=0)firebase.auth().signInWithRedirect(p);else{CM.note="Login gagal ("+((e&&e.code)||"coba lagi")+")";CM.draw()}})},
logout(){firebase.auth().signOut()},
async post(){const text=(CM.draft||"").trim();if(!text)return;
 if(Date.now()-CM.last<10000){CM.note="Tunggu beberapa detik sebelum komentar lagi.";CM.draw();return}
 if(CM.cfg){if(!CM.user){CM.note="Masuk dengan Google dulu untuk berkomentar.";CM.draw();return}
  try{await CM.fs.collection("comments").add({uid:CM.user.uid,name:(CM.user.displayName||"Netizen").slice(0,40),text:text.slice(0,500),rumor:!!CM.rumor,ts:firebase.firestore.FieldValue.serverTimestamp()});CM.note="";CM.draft="";CM.last=Date.now()}catch(e){CM.note="Komentar gagal dikirim. Coba lagi."}}
 else{CM.items.unshift({id:String(Date.now()),uid:"me",name:(CM.nm||"Netizen").trim().slice(0,40)||"Netizen",text:text.slice(0,500),rumor:!!CM.rumor,ts:Date.now()});
  try{localStorage.setItem("moc_cm",JSON.stringify(CM.items.slice(0,100)))}catch(e){}CM.draft="";CM.last=Date.now()}
 CM.draw()},
async del(id){if(CM.cfg){try{await CM.fs.collection("comments").doc(id).delete()}catch(e){CM.note="Gagal menghapus.";CM.draw()}}
 else{CM.items=CM.items.filter(c=>c.id!=id);try{localStorage.setItem("moc_cm",JSON.stringify(CM.items))}catch(e){}CM.draw()}},
fmt(t){const ms=t&&t.toMillis?t.toMillis():(typeof t=="number"?t:0);if(!ms)return"baru saja";const d=new Date(ms);return d.getDate()+" "+B[d.getMonth()]+" "+d.getFullYear()+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")},
draw(){const el=$("#cm");if(!el)return;
 const mine=c=>CM.cfg?(CM.user&&c.uid==CM.user.uid):c.uid=="me";
 let top;if(CM.cfg)top=CM.user?'Masuk sebagai <b>'+esc(CM.user.displayName||CM.user.email||"akun Google")+'</b>. <button class="vb" style="min-width:0;padding:3px 10px;margin-left:6px" onclick="CM.logout()">Keluar</button>':'Masuk dengan akun Google untuk berkomentar. <button class="vb on" onclick="CM.login()">Masuk dengan Google</button>';
 else top='Komentar belum tersambung ke server, jadi hanya tersimpan di perangkat ini.';

 el.innerHTML='<div class="cmf"><div class="vt-n">'+top+(CM.note?'<br><b>'+esc(CM.note)+'</b>':'')+'</div>'
  +(CM.cfg?'':'<input id="cmn" maxlength="40" placeholder="Nama kamu" value="'+esc(CM.nm)+'" oninput="CM.nm=this.value">')

  +(CM.items.length?CM.items.map(c=>'<div class="cmi'+(c.rumor?' rm':'')+'"><div class="cmh"><b>'+esc(c.name)+'</b>'+(c.rumor?'<em class="tg">Rumor</em>':'')+'<span class="mute">'+CM.fmt(c.ts)+'</span>'+(mine(c)?'<button class="vb" style="min-width:0;padding:2px 8px;margin-left:auto" onclick="CM.del(\''+esc(c.id)+'\')">Hapus</button>':'')+'</div><p>'+esc(c.text)+'</p></div>').join(""):'<p class="mute">Belum ada komentar. Jadi yang pertama!</p>');

 const lc=["ID","MY"].map(l=>{const x=TOUR.find(t=>t.l==l),ks=Object.keys(T).filter(k=>T[k].l==l);return '<div class="lc" style="--c:'+(l=="ID"?"#d4182f":"#1c4fd8")+'"><div class="hd"><img class="lo" src="'+(l=="ID"?LOGO_ID:LOGO_MY)+'" alt=""><div><h2>'+x.t+'</h2><span class="mute">'+x.s+'</span></div></div><p>'+x.d+'</p><div class="strip">'+ks.map(k=>hx(k,34)).join("")+'</div><div class="chips"><span class="chip">'+ks.length+' tim</span><span class="chip">Online</span></div></div>'}).join("");
 const px=TOUR.find(t=>t.l=="PRO"),pro='<a class="lc pro" href="#tournament" style="--c:#d9a93a"><div class="hd"><img class="lo" src="'+LOGO_PRO+'" alt=""><div><h2>'+px.t+'</h2><span class="mute">'+px.s+'</span></div></div><p>'+px.d+'</p><div class="chips"><span class="chip">Lihat prestasi tim</span></div></a>';
 return '<div class="hero"><div class="in"><span class="eyebrow">Indonesia × Malaysia · Mobile Legends: Bang Bang</span><h1>MOC: MLBB Championship</h1><p>Turnamen Mobile Legends: Bang Bang online untuk tim Indonesia dan Malaysia.</p><div class="cta"><a class="btn p" href="#vote">Vote sekarang</a><a class="btn" href="#schedule">Lihat jadwal</a></div></div></div>'
 +'<section class="in"><div class="lgs">'+lc+pro+'</div></section>'
 +(live.length?sec("Sedang live","schedule",live.map(match).join("")):"")
 +sec("Pertandingan berikutnya","schedule",up.length?up.map(match).join(""):'<div class="empty">Jadwal belum diumumkan.</div>')
 +sec("Hasil terbaru","schedule",done.length?done.map(match).join(""):'<div class="empty">Belum ada hasil.</div>')
 +sec("Klasemen","",'<div class="two">'+stand("ID")+stand("MY")+'</div>')
 +'<section class="in"><div class="vcta"><div><h2>Vote Pemain &amp; Tim Terbaik</h2><p>Pilih jagoanmu: pemain mingguan, pemain season, tim terbaik, dan Dream Team.</p></div><a class="btn p" href="#vote">Buka halaman vote</a></div></section>'},
teams(){return `<div class="pg in"><h1>Teams</h1><p>Seluruh tim yang berpartisipasi.</p>${[["ID","Indonesia"],["MY","Malaysia"]].map(([l,n])=>`<h2 class="lh" style="--c:${col(l)}">${n}</h2><div class="grid">${Object.keys(T).filter(k=>T[k].l==l).map(k=>`<div class="tc">${hx(k,56)}<div><b>${T[k].n}</b><span>${T[k].a} · ${T[k].city}</span></div></div>`).join("")}</div>`).join("")}</div>`},
players(){const ap=AP();return '<div class="pg in"><h1>Players</h1><p>Database pemain per tim.</p>'+[["ID","Indonesia"],["MY","Malaysia"]].map(([l,n])=>'<h2 class="lh" style="--c:'+col(l)+'">'+n+'</h2><div class="tgd">'+Object.keys(T).filter(k=>T[k].l==l).map(k=>{const ps=ap.filter(p=>p[2]==k);return '<div class="tbx" style="--c:'+T[k].c+'"><div class="tbh">'+hx(k,48)+'<div><b>'+esc(T[k].n)+'</b><span class="mute">'+ps.length+' pemain</span></div></div>'+(ps.length?ps.map(p=>'<div class="pr"><b>'+esc(p[0])+'</b><em>'+esc(p[1])+'</em></div>').join(""):'<p class="mute" style="margin:6px 0 0">Belum ada data pemain.</p>')+'</div>'}).join("")+'</div>').join("")+'</div>'},
schedule(f){f=f||"all";
 const ok=m=>f=="all"||f==m[0]||(f=="live"&&m[6]=="live")||(f=="upcoming"&&m[6]=="upcoming")||(f=="done"&&m[6]=="done");
 const ms=sorted().filter(ok),wk=[...new Set(ms.map(m=>m[1]))].sort((a,b)=>b-a);
 const tabs=[["all","Semua"],["ID","MOC ID"],["MY","MOC MY"],["live","Live"],["upcoming","Upcoming"],["done","Previous"]];
 return `<div class="pg in"><h1>Schedule</h1><div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]==f?"on":""}" onclick="sched('${t[0]}')">${t[1]}</button>`).join("")}</div>${wk.length?wk.map(w=>`<h2 class="wk">Week ${w}</h2>`+ms.filter(m=>m[1]==w).map(match).join("")).join(""):empty("Belum ada pertandingan.")}</div>`},
tournament(){
 const lg=l=>l=="ID"?LOGO_ID:l=="MY"?LOGO_MY:LOGO_PRO,cl=l=>l=="PRO"?"#d9a93a":col(l);
 const cd=x=>'<div class="card" style="--c:'+cl(x.l)+'"><div class="hd2"><img class="lo" src="'+lg(x.l)+'" alt=""><div><h3>'+x.t+'</h3><p class="mute">'+x.d+'</p></div></div><p style="font-size:13px;margin-top:10px">'+x.s+'</p></div>';
 const pr=r=>PR.filter(p=>p[0]==r).map(p=>'<div class="pz"><span class="pl">'+(p[2]&&T[p[2]]?hx(p[2],40):'<span class="hx" style="--s:40px;background:#56608a">'+p[1][0]+'</span>')+'</span><div><b>'+p[1]+'</b><span class="res'+(/^(Belum|Diskualifikasi)/.test(p[3])?' off':'')+'">'+p[3]+(p[4]?' · '+p[4]:'')+'</span></div>'+(p[5]?'<em class="tg">'+p[5]+'</em>':'')+'</div>').join("");
 return '<div class="pg in"><h1>Tournament</h1><p>Daftar turnamen.</p><div class="grid">'+TOUR.map(cd).join("")+'</div><h2 class="lh" style="--c:#d9a93a">Prestasi Terbaik di MOC Pro Internasional</h2><div class="two"><div style="--c:var(--red)"><h3>Tim Indonesia</h3>'+pr("ID")+'</div><div style="--c:var(--blue)"><h3>Tim Malaysia</h3>'+pr("MY")+'</div></div></div>'},
about(){return `<div class="pg in"><h1>About Us</h1><p>Mengenal MOC: MLBB Championship.</p><div class="card" style="--c:var(--red);max-width:720px"><p>MOC: MLBB Championship adalah turnamen komunitas Mobile Legends: Bang Bang yang dimainkan penuh secara online, dengan kompetisi terpisah untuk tim Indonesia dan Malaysia. Ganti teks ini dengan profil penyelenggara, kontak, dan tautan sosial media.</p></div></div>`}
};

/* ===== FIREBASE: isi dari Firebase Console > Project settings > Your apps (Web) ===== */
const FB={apiKey:"ISI_API_KEY",authDomain:"ISI.firebaseapp.com",projectId:"ISI_PROJECT_ID",appId:"ISI_APP_ID"};
const ROLES=["Gold","EXP","Mid","Jungle","Roamer"];
const VT={db:null,uid:null,votes:{},mine:{},tab:"w",wk:1,shared:false,note:"",
async init(){VT.local();VT.draw();
 try{if(window.firebase&&FB.apiKey&&FB.apiKey.indexOf("ISI_")!=0){VT.cfg=true;if(!firebase.apps.length)firebase.initializeApp(FB);VT.fs=firebase.firestore();VT.shared=true;VT.votes={};VT.mine={};
  firebase.auth().onAuthStateChanged(u=>{VT.user=u;VT.uid=u?u.uid:null;VT.mine=(u&&VT.votes[u.uid])||{};VT.draw()});
  VT.fs.collection("votes").onSnapshot(sn=>{VT.votes={};sn.docs.forEach(d=>VT.votes[d.id]=d.data());VT.mine=(VT.uid&&VT.votes[VT.uid])||VT.mine;VT.draw()},()=>{VT.cfg=false;VT.shared=false;VT.local();VT.draw()})}}catch(e){VT.cfg=false;VT.shared=false}
},
login(){if(!VT.cfg)return;const p=new firebase.auth.GoogleAuthProvider();
 firebase.auth().signInWithPopup(p).then(()=>{VT.note=""}).catch(e=>{if(e&&e.code&&e.code.indexOf("popup")>=0)firebase.auth().signInWithRedirect(p);else{VT.note="Login gagal ("+((e&&e.code)||"coba lagi")+")";VT.draw()}})},
logout(){firebase.auth().signOut()},
tcard(k){const c=VT.cnt("t",k),tot=Math.max(1,Object.values(VT.votes).filter(v=>v.t!=null).length),on=VT.mine.t==k;
 return '<div class="vp">'+hx(k,44)+'<div><b>'+T[k].n+'</b><span class="s">'+T[k].city+'</span></div><div class="vr"><span class="vc">'+c+'</span><button class="vb '+(on?"on":"")+'" onclick="VT.save(\'t\','+(on?"null":"'"+k+"'")+')">'+(on?"Dipilih ✓":"Vote")+'</button></div><div class="bar" style="width:'+Math.round(c/tot*100)+'%"></div></div>'},
local(){try{VT.mine=JSON.parse(localStorage.getItem("moc_vote")||"{}")}catch(e){VT.mine={}}VT.votes={me:VT.mine}},
async save(k,v){if(VT.cfg&&!VT.user){VT.note="Masuk dengan Google dulu untuk memberi suara.";VT.draw();return}VT.mine={...VT.mine,[k]:v};VT.votes[VT.uid||"me"]=VT.mine;
 if(VT.shared){try{await VT.fs.collection("votes").doc(VT.uid).set(VT.mine);VT.note=""}catch(e){VT.note="Suara belum bisa disimpan ke server. Coba lagi sebentar."}}
 else{try{localStorage.setItem("moc_vote",JSON.stringify(VT.mine))}catch(e){}}
 VT.draw()},
cnt(k,i){return Object.values(VT.votes).filter(v=>v[k]==i).length},
card(i,k){const p=P[i],c=VT.cnt(k,i),tot=Math.max(1,Object.values(VT.votes).filter(v=>v[k]!=null).length),on=VT.mine[k]==i;
 return '<div class="vp" style="--c:'+col(T[p[2]].l)+'">'+hx(p[2],44)+'<div><b>'+p[0]+'</b><span class="s">'+p[1]+', '+T[p[2]].n+'</span></div><div class="vr"><span class="vc">'+c+'</span><button class="vb '+(on?"on":"")+'" onclick="VT.save(\''+k+'\','+(on?"null":i)+')">'+(on?"Dipilih ✓":"Vote")+'</button></div><div class="bar" style="width:'+Math.round(c/tot*100)+'%"></div></div>'},
draw(){const el=$("#vt");if(!el)return;const wks=Array.from({length:Math.max(MINGGU,...M.map(m=>m[1]))},(_,i)=>i+1);
 const tabs=[["w","Pemain Terbaik Mingguan"],["s","Pemain Terbaik Season"],["t","Tim Terbaik Season"],["d","Dream Team"]];
 let b="";
 if(VT.tab=="w")b='<div class="vw"><span class="mute">Pilih week:</span>'+wks.map(w=>'<button class="tab '+(w==VT.wk?"on":"")+'" onclick="VT.wk='+w+';VT.draw()">Week '+w+'</button>').join("")+'</div>'+P.map((p,i)=>VT.card(i,"w"+VT.wk)).join("");
 else if(VT.tab=="s")b=P.map((p,i)=>VT.card(i,"s")).join("");
 else if(VT.tab=="t")b=Object.keys(T).map(k=>VT.tcard(k)).join("");
 else b=ROLES.map(r=>'<h2 class="lh" style="--c:var(--blue)">'+r+'</h2>'+P.map((p,i)=>p[1]==r?VT.card(i,"d_"+r):"").join("")).join("");
 if(!P.length&&VT.tab!="t")b='<p class="mute">Pemain belum ditambahkan.</p>';
 let n;if(VT.cfg){n=VT.user?'Masuk sebagai <b>'+(VT.user.displayName||VT.user.email||"akun Google")+'</b>. Satu akun satu suara per kategori, bisa diganti kapan saja. <button class="vb" style="min-width:0;padding:3px 10px;margin-left:6px" onclick="VT.logout()">Keluar</button>':'Masuk dengan akun Google untuk memberi suara. Satu akun satu suara per kategori. <button class="vb on" onclick="VT.login()">Masuk dengan Google</button>'}else n="Mode lokal: suara hanya tersimpan di perangkat ini. Firebase belum diisi, jadi hitungan bersama dan login Google belum aktif.";
 el.innerHTML='<div class="vt-t">'+tabs.map(t=>'<button class="tab '+(t[0]==VT.tab?"on":"")+'" onclick="VT.tab=\''+t[0]+'\';VT.draw()">'+t[1]+'</button>').join("")+'</div><div class="vt-n">'+n+(VT.note?"<br><b>"+VT.note+"</b>":"")+'</div>'+b}};
pages.vote=()=>'<div class="pg in"><h1>Vote</h1><p>Pilih jagoanmu untuk pemain, tim, dan Dream Team terbaik.</p><div id="vt"></div></div>';

pages.fmvp=()=>{const tb=k=>T[k]?hx(k,40):'<span class="hx" style="--s:40px;background:#56608a">'+k[0]+'</span>',
 nm=k=>T[k]?T[k].n:k,
 row=(x,y)=>'<div class="pz"><span class="pl">'+tb(x[1])+'</span><div><b>'+x[2]+'</b><span class="res">'+nm(x[1])+' · '+y+'</span></div><em class="tg">'+x[0]+'</em></div>',
 all=FMVP.flatMap(f=>f.r),bz=all.filter(x=>x[1]=="BLZR").length;
 return '<div class="pg in"><h1>FMVP</h1><p>Urutan Final MVP di setiap turnamen.</p><div class="chips" style="margin:6px 0 14px"><span class="chip">Blitz Revolution: '+bz+' FMVP dari '+all.length+'</span></div>'+FMVP.map(f=>'<h2 class="lh" style="--c:'+f.c+'">FMVP '+f.t+' S1–S'+f.r.length+'</h2><div style="--c:'+f.c+'">'+f.r.map(x=>row(x,f.t)).join("")+'</div>').join("")+'</div>'};
pages.transfer=()=>{const st=x=>x=="resmi"?"Resmi":"Rumor",
 row=t=>'<div class="pz"><span class="pl">'+TB(t[3])+'</span><div><b>'+esc(t[1])+'</b><span class="res">'+esc(t[2])+' · '+esc(NM(t[3]))+' → '+esc(NM(t[4]))+' · '+fd(t[0])+'</span></div><span class="pl">'+TB(t[4])+'</span><em class="tg">'+st(t[5])+'</em></div>',
 l=[...TRANSFERS].sort((a,b)=>b[0].localeCompare(a[0]));
 return '<div class="pg in"><h1>Bursa Transfer</h1><p>Siapa pindah dari tim lama ke tim baru.</p>'+(l.length?l.map(row).join(""):empty("Belum ada transfer diumumkan."))+'<div class="vcta" style="margin-top:18px"><div><h2>Ada kabar atau rumor?</h2><p>Tulis di kolom komentar dan centang Rumor transfer.</p></div><a class="btn p" href="#komentar">Buka komentar</a></div></div>'};
pages.komentar=()=>'<div class="pg in"><h1>Komentar</h1><p>Obrolan netizen tentang MOC dan rumor kepindahan pemain. Rumor belum tentu benar.</p><div id="cm"></div></div>';

const nav=[["home","Home"],["teams","Teams"],["players","Players"],["schedule","Schedule"],["tournament","Tournament"],["fmvp","FMVP"],["transfer","Transfer"],["komentar","Komentar"],["vote","Vote"],["about","About us"]];
function go(){const p=(location.hash||"#home").slice(1),k=pages[p]?p:"home";
 $("#nav").innerHTML=nav.map(n=>`<a href="#${n[0]}" class="${n[0]==k?"on":""}">${n[1]}</a>`).join("");
 $("#app").innerHTML=pages[k]();scrollTo(0,0);if(k=="vote")VT.init();if(k=="komentar")CM.init()}
function sched(f){$("#app").innerHTML=pages.schedule(f)}
["l1","f1"].forEach(i=>$("#"+i).src=LOGO_ID);["l2","f2"].forEach(i=>$("#"+i).src=LOGO_MY);
addEventListener("hashchange",go);go();
</script></body></html>
